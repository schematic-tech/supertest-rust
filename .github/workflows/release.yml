# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: Release
'on':
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'schematic-tech/supertest-rust'
    uses: ./.github/workflows/ci.yml
  publish:
    needs:
    - build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python scripts/release.py guard
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: dist
    - run: python scripts/release.py verify-assets
    - run: 'rustup toolchain install 1.97.1 --profile minimal

        rustup override set 1.97.1'
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      id: auth
      if: env.BOOTSTRAP_TOKEN == ''
    - run: python scripts/publish_crates.py
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_TOKEN }}
    - run: python scripts/release.py github
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
